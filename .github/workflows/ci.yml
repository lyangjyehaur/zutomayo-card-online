name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}"; then
            base_sha="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          git diff --name-only "$base_sha" "$HEAD_SHA" | tee /tmp/changed-files.txt
          docs_only=true
          if [[ ! -s /tmp/changed-files.txt ]]; then
            docs_only=false
          else
            while IFS= read -r path; do
              case "$path" in
                *.md | docs/* | LICENSE | LICENSE.*) ;;
                *) docs_only=false ;;
              esac
            done < /tmp/changed-files.txt
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint-and-test:
    name: Lint & Test
    needs: classify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Compose configuration
        if: needs.classify.outputs.docs_only != 'true'
        env:
          PG_PASSWORD: e2e-test-password
          PG_MIGRATION_USER: zutomayo_migrator
          PG_MIGRATION_PASSWORD: e2e-test-migration-password
          PG_APP_USER: zutomayo_app
          PG_APP_PASSWORD: e2e-test-app-password
          PG_HOST: staging-postgres.example.internal
          PG_DATABASE: zutomayo
          PG_CA_FILE: /tmp/zutomayo-service-ca.crt
          PG_SSLROOTCERT: /run/secrets/zutomayo-service-ca.crt
          NODE_EXTRA_CA_CERTS: /run/secrets/zutomayo-service-ca.crt
          REDIS_URL: rediss://:e2e-test-redis-password@staging-redis.example.internal:6380
          JWT_SECRET: e2e-test-jwt-secret-32chars-min
          REDIS_PASSWORD: e2e-test-redis-password
          MEILI_MASTER_KEY: e2e-test-meilisearch-master-key
          METRICS_TOKEN: e2e-test-metrics-token
          PGSSLMODE: verify-full
          APP_VERSION: '0.2.0'
          APP_BUILD_ID: '0000000000000000000000000000000000000000'
          GAME_RULES_VERSION: '0.2.0'
        run: |
          touch .env
          export EXPECTED_SCHEMA_MIGRATION="$(find migrations -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort | tail -n 1 | sed 's/\.js$//')"
          export EXPECTED_SCHEMA_CHECKSUM="$(sha256sum "migrations/${EXPECTED_SCHEMA_MIGRATION}.js" | awk '{print $1}')"
          npm run release:config
          npm run ops:config
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
          docker compose -f docker-compose.server4.yml config --no-env-resolution --quiet

      - name: Format check
        run: npm run format:check:tracked

      - name: Check card source-data policy
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run data:policy

      - name: Check card image policy
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run image:policy

      - name: Check version sync
        run: npm run version:check

      - name: Lint
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run lint

      - name: Typecheck (app)
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Typecheck (scripts)
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run typecheck:scripts

      - name: Check i18n completeness
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run i18n:check

      - name: Unit tests and coverage gate
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run test:coverage

      - name: Build
        if: needs.classify.outputs.docs_only != 'true'
        env:
          # APP_BUILD_ID 設為 git commit hash，確保每次 CI build 有獨立 Sentry release。
          APP_BUILD_ID: ${{ github.sha }}
          # Source map 上傳到 GlitchTip（secrets 未設定時跳過上傳，僅產生 hidden source map）。
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx vite build

  core-e2e:
    name: Core E2E Tests
    needs: classify
    runs-on: ubuntu-latest
    env:
      PG_PASSWORD: e2e-test-password
      JWT_SECRET: e2e-test-jwt-secret-32chars-min
      REDIS_PASSWORD: ''
      MEILI_MASTER_KEY: e2e-test-meilisearch-master-key
      METRICS_TOKEN: e2e-test-metrics-token
      PGSSLMODE: disable

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and start service stack
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          mkdir -p playwright-report test-results
          export EXPECTED_SCHEMA_MIGRATION="$(find migrations -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort | tail -n 1 | sed 's/\.js$//')"
          export EXPECTED_SCHEMA_CHECKSUM="$(sha256sum "migrations/${EXPECTED_SCHEMA_MIGRATION}.js" | awk '{print $1}')"
          echo "EXPECTED_SCHEMA_MIGRATION=$EXPECTED_SCHEMA_MIGRATION" >> "$GITHUB_ENV"
          echo "EXPECTED_SCHEMA_CHECKSUM=$EXPECTED_SCHEMA_CHECKSUM" >> "$GITHUB_ENV"
          export PG_MIGRATION_USER=zutomayo_migrator PG_MIGRATION_PASSWORD=e2e-test-migration-password
          export PG_APP_USER=zutomayo_app PG_APP_PASSWORD=e2e-test-app-password
          compose=(docker compose -f docker-compose.yml -f docker-compose.e2e.yml)
          if "${compose[@]}" up --build --wait --wait-timeout 180 game api platform \
            2>&1 | tee "$log_file" \
            && "${compose[@]}" build e2e 2>&1 | tee -a "$log_file" \
            && "${compose[@]}" run --rm e2e npm run e2e:core 2>&1 | tee -a "$log_file"; then
            exit 0
          fi
          service_status="$("${compose[@]}" ps --all --format '{{.Service}}={{.State}}/{{.ExitCode}}' | tr '\n' ' ')"
          echo "::error title=E2E service status::$service_status"
          for service in game api platform e2e; do
            service_log="$("${compose[@]}" logs --no-color --tail 40 "$service" | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=E2E $service log::$service_log"
          done
          "${compose[@]}" logs --no-color --tail 80 migrate seed game api platform e2e \
            2>&1 | tee -a "$log_file" || true
          details="$(tail -n 60 "$log_file" | tr '\n' ' ' | sed 's/%/%25/g')"
          echo "::error title=E2E service stack::$details"
          exit 1
        timeout-minutes: 20

      - name: Skip E2E for documentation-only changes
        if: needs.classify.outputs.docs_only == 'true'
        run: echo 'Core E2E is not required for documentation-only changes.'

      - name: Upload Playwright report
        if: always() && needs.classify.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always() && needs.classify.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always() && needs.classify.outputs.docs_only != 'true'
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            down -v || true

  pr-gate:
    name: PR Gate
    if: always()
    needs: [classify, lint-and-test, core-e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          LINT_TEST_RESULT: ${{ needs.lint-and-test.result }}
          CORE_E2E_RESULT: ${{ needs.core-e2e.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]]
          [[ "$LINT_TEST_RESULT" == success ]]
          [[ "$CORE_E2E_RESULT" == success ]]

  # Smoke tests 需要真實卡牌數據（422 張），CI 環境無法模擬
  # 本地執行: npm run smoke / smoke:api / smoke:online
  # smoke-tests:
  #   name: Smoke Tests
  #   runs-on: ubuntu-latest
  #   needs: lint-and-test
  #   ...
